<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Live train radar icon">
  <!-- Full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="#0b1020"/>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="#141a2e"/>
  <!-- radar sweep rings -->
  <circle cx="256" cy="276" r="176" fill="none" stroke="#3ddc84" stroke-opacity="0.18" stroke-width="6"/>
  <circle cx="256" cy="276" r="120" fill="none" stroke="#3ddc84" stroke-opacity="0.28" stroke-width="6"/>
  <!-- sweep beam -->
  <path d="M256 276 L256 100 A176 176 0 0 1 408 190 Z" fill="#3ddc84" fill-opacity="0.16"/>
  <!-- radar blips -->
  <circle cx="336" cy="176" r="12" fill="#3ddc84"/>
  <circle cx="160" cy="330" r="9" fill="#3ddc84" fill-opacity="0.6"/>
  <!-- train: front view -->
  <g>
    <!-- body -->
    <rect x="166" y="180" width="180" height="204" rx="46" fill="#ffd23f"/>
    <!-- windshield -->
    <rect x="190" y="204" width="132" height="76" rx="24" fill="#0b1020"/>
    <!-- destination panel glint -->
    <rect x="202" y="216" width="52" height="10" rx="5" fill="#3ddc84" fill-opacity="0.8"/>
    <!-- headlights -->
    <circle cx="208" cy="330" r="17" fill="#eef2ff"/>
    <circle cx="304" cy="330" r="17" fill="#eef2ff"/>
    <!-- coupler / bumper -->
    <rect x="216" y="384" width="80" height="18" rx="9" fill="#97a1c4"/>
    <!-- rails -->
    <rect x="150" y="416" width="30" height="14" rx="7" fill="#2a3350"/>
    <rect x="332" y="416" width="30" height="14" rx="7" fill="#2a3350"/>
    <rect x="196" y="416" width="120" height="14" rx="7" fill="#2a3350"/>
  </g>
</svg>
